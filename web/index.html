<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>toSub2 控制台</title>
    <script>
      // 提前应用主题，避免闪烁
      (function () {
        try {
          var theme = localStorage.getItem('tosub2-theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__bootErrors = [];
      window.addEventListener('error', function (e) {
        window.__bootErrors.push(String(e.message));
        var d = document.createElement('div');
        d.id = 'boot-error';
        d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#dc2626;color:#fff;padding:8px;font:12px monospace;white-space:pre-wrap;z-index:99999';
        d.textContent = 'JS ERROR: ' + e.message;
        document.body.appendChild(d);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#b45309;color:#fff;padding:8px;font:12px monospace;white-space:pre-wrap;z-index:99999';
        d.textContent = 'REJECTION: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
